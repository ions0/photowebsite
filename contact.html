<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Jared Cambridge Photography</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100;300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h3><a href="index.html">Jared Cambridge Photography</a></h3>
    </header>

    <nav>
        <ul>
            <li><a href="people.html">People</a></li>
            <li><a href="nature.html">Nature</a></li>
            <li><a href="music.html">Music</a></li>
            <li><a href="street.html">Street</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section class="contact-section">
            <h1 class="contact-title">Get in touch</h1>
            <p class="contact-intro">Questions, bookings or just want to say hello? Send a message below.</p>

            <form id="contact-form" class="contact-form" action="https://formspree.io/f/xdealvpb" method="POST" novalidate>

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" autocomplete="name" maxlength="100" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" maxlength="150" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" maxlength="2000" required></textarea>
                </div>

                <div class="hp-field" aria-hidden="true">
                    <label for="website">Leave this field empty</label>
                    <input type="text" id="website" name="_gotcha" tabindex="-1" autocomplete="off">
                </div>

                <input type="hidden" id="form-start" name="form_start" value="">

                <p id="form-status" class="form-status" role="status" aria-live="polite"></p>

                <button type="submit" class="contact-btn">Send message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; Jared Cambridge 2026</p>
    </footer>

    <script>
        (function () {
            var form = document.getElementById('contact-form');
            var status = document.getElementById('form-status');
            var startField = document.getElementById('form-start');
            var loadedAt = Date.now();
            var MIN_SECONDS = 3;
            startField.value = loadedAt;

            function showStatus(msg, isError) {
                status.textContent = msg;
                status.className = 'form-status ' + (isError ? 'error' : 'success');
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                status.textContent = '';

                if (document.getElementById('website').value !== '') {
                    showStatus('Thanks! Your message has been sent.', false);
                    form.reset();
                    return;
                }

                if ((Date.now() - loadedAt) / 1000 < MIN_SECONDS) {
                    showStatus('That was a bit quick. Please try again.', true);
                    return;
                }

                var name = form.name.value.trim();
                var email = form.email.value.trim();
                var message = form.message.value.trim();
                if (!name || !email || !message) {
                    showStatus('Please fill in all fields.', true);
                    return;
                }
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showStatus('Please enter a valid email address.', true);
                    return;
                }

                var btn = form.querySelector('button');
                btn.disabled = true;

                fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                }).then(function (res) {
                    if (res.ok) {
                        showStatus('Thanks! Your message has been sent.', false);
                        form.reset();
                        loadedAt = Date.now();
                    } else {
                        showStatus('Something went wrong. Please try again later.', true);
                    }
                }).catch(function () {
                    showStatus('Network error. Please try again later.', true);
                }).finally(function () {
                    btn.disabled = false;
                });
            });
        })();
    </script>
</body>
</html>
